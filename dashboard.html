<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2937 0, #020617 60%);
      color: #e5e7eb;
    }

    .card {
      padding: 2rem 2.5rem;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(129, 140, 248, 0.4);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.7rem;
    }

    p {
      margin-bottom: 1.2rem;
      color: #9ca3af;
    }

    .username {
      font-weight: 600;
      color: #e5e7eb;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      border: 1px solid rgba(148, 163, 255, 0.7);
      color: #e5e7eb;
    }

    button:hover {
      filter: brightness(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to your dashboard</h1>
    <p>
      Hello, <span class="username" id="user-name">Guest</span>.
    </p>
    <p>You logged in successfully. Ready to jump into Minecraft?</p>

    <div class="buttons">
      <button onclick="goToMinecraft()">Play Minecraft</button>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>
  </div>

  <script>
  // Show user's name from localStorage if available
  (function showUserName() {
    const raw = localStorage.getItem('demoUser');
    if (!raw) return;
    try {
      const user = JSON.parse(raw);
      if (user && user.name) {
        document.getElementById('user-name').textContent = user.name;
      }
    } catch (e) {
      // ignore
    }
  })();

  function goToMinecraft() {
    // Redirect to the Minecraft game inside folder minecraft/index.html
    window.location.href = 'index(2).html';
  }

  function logout() {
    localStorage.removeItem('rememberedLogin');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
